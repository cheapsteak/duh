name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: macos-14   # APFS + Apple Silicon; hdiutil available for gold tests
    timeout-minutes: 30 # cap so a hung hdiutil/df poll can't burn the whole runner budget
    steps:
      - uses: actions/checkout@v4

      - name: viewer assets in sync
        run: |
          sh scripts/sync-viewer.sh
          git diff --exit-code docs/v/
          test -z "$(git status --porcelain docs/v/)"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # setup-python gives us a pip-installable interpreter without hitting
      # the PEP 668 "externally-managed-environment" guard that Homebrew's
      # system python3 enforces on macos-14 runners.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: cargo test --release
      - run: cargo build --release

      - name: install pytest
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest || python3 -m pip install --user --break-system-packages pytest

      # The python oracle lives at reference/duh-py; the rust binary is duh.
      # DUH_BIN only ever points at the rust binary here, and the parity step
      # resolves both binaries internally (blackbox/test_db_parity.py), so no
      # step references the oracle path directly.
      - name: black-box suite vs rust
        run: DUH_BIN=$PWD/target/release/duh python3 -m pytest blackbox/ -q

      - name: gold tests vs rust
        run: DUH_BIN=$PWD/target/release/duh python3 -m pytest blackbox/ -m slow -q

      - name: parity vs python reference
        run: python3 -m pytest blackbox/test_db_parity.py -q

  # Linux: hardlink families only (no clone/reflink detection). Runs the Rust
  # tests and the platform-neutral black-box suite; the APFS/hdiutil gold tests
  # and the Python-oracle parity tests skip themselves off macOS.
  linux:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        id: rust-cache

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: cargo test --release
      - run: cargo build --release

      - name: selftest
        run: ./target/release/duh selftest

      - name: install pytest
        run: python3 -m pip install pytest

      - name: black-box suite vs rust
        run: DUH_BIN=$PWD/target/release/duh python3 -m pytest blackbox/ -q -rs

      # Footprint numbers for deciding whether to install on a box. Informational:
      # nothing here gates the job.
      - name: measurements
        run: |
          set -x
          echo "rust-cache hit: ${{ steps.rust-cache.outputs.cache-hit }}"
          uname -m; nproc; df -hT / | tail -1
          ls -l target/release/duh
          cp target/release/duh /tmp/duh-stripped && strip /tmp/duh-stripped
          ls -l /tmp/duh-stripped
          # Clean release build in a fresh target dir (the cache only covers target/).
          /usr/bin/time -f 'clean build: wall=%es maxrss=%MKB' \
            env CARGO_TARGET_DIR=/tmp/clean-target cargo build --release -q
          for tree in "$HOME/.cargo" /usr; do
            db=/tmp/measure-$(basename "$tree").db
            rm -f "$db"
            find "$tree" -xdev | wc -l
            du -sxh "$tree" 2>/dev/null | tail -1
            /usr/bin/time -v ./target/release/duh --db "$db" scan -q "$tree" 2>&1 \
              | grep -E 'Elapsed|Maximum resident|^warning|error' || true
            ls -l "$db"
            /usr/bin/time -f 'freeable compute: wall=%es maxrss=%MKB' \
              ./target/release/duh --db "$db" freeable "$tree"
            ./target/release/duh --db "$db" stats > /tmp/stats.txt
            head -20 /tmp/stats.txt
          done

      # The target workload: two checkouts whose .venv is hardlinked into the uv
      # cache (uv's default on Linux). Deleting one checkout frees only what is
      # not held by the cache; excluded vs included .venv shows the difference.
      - name: uv hardlink scenario
        run: |
          set -x
          python3 -m pip install -q uv
          mkdir -p /tmp/work && cd /tmp/work
          for p in a b; do
            mkdir "$p" && (cd "$p" && uv venv -q && uv pip install -q --link-mode hardlink numpy pandas)
            head -c 3145728 /dev/urandom > "$p/own.bin"
          done
          du -sh ~/.cache/uv /tmp/work/a
          duh=$GITHUB_WORKSPACE/target/release/duh
          $duh --db /tmp/uv-default.db scan /tmp/work
          $duh --db /tmp/uv-default.db freeable /tmp/work/a
          $duh --db /tmp/uv-incl.db scan -q --include .venv /tmp/work
          $duh --db /tmp/uv-incl.db freeable /tmp/work/a
          ls -l /tmp/uv-default.db /tmp/uv-incl.db
